name: SEO/AEO Daily Digest

on:
  schedule:
    # 09:00 Asia/Shanghai = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: seo-aeo-daily-digest
  cancel-in-progress: false

jobs:
  seo-aeo-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate digest generator
        run: |
          npm run check
          npm test

      - name: Run SEO/AEO digest
        env:
          GITHUB_MODELS_TOKEN: ${{ github.token }}
          SEO_AI_MODEL: openai/gpt-4.1
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: node seo_automation.mjs

      - name: Commit generated reports and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ seo_automation_state.json
          if git diff --cached --quiet; then
            echo "No report/state changes to commit."
          else
            git commit -m "chore: update SEO/AEO daily digest"
            git push
          fi
